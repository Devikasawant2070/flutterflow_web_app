name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - flutterflow

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Set up service account credentials
        run: |
          echo "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}" > $HOME/credentials.json

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project school-4e5c2
        env:
          GOOGLE_APPLICATION_CREDENTIALS: $HOME/credentials.json
